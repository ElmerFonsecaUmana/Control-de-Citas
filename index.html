<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Citas Médicas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --papa-color: #2563EB;
    --papa-light: #DBEAFE;
    --mama-color: #DB2777;
    --mama-light: #FCE7F3;
    --bg: #F8F7F4;
    --surface: #FFFFFF;
    --border: #E5E2DC;
    --text: #1C1917;
    --text-muted: #78716C;
    --radius: 16px;
    --shadow: 0 4px 24px rgba(0,0,0,0.07);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 28px 16px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em;
  }
  .sync-indicator { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 500; color: var(--text-muted); }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #D1D5DB; transition: background 0.3s; }
  .sync-dot.online  { background: #22C55E; }
  .sync-dot.syncing { background: #F59E0B; animation: pulse 1s infinite; }
  .sync-dot.error   { background: #EF4444; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .header-legend { display: flex; gap: 18px; margin-top: 8px; align-items: center; }
  .legend-dot { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 500; color: var(--text-muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.papa { background: var(--papa-color); }
  .dot.mama { background: var(--mama-color); }

  /* TABS */
  .tabs { display: flex; background: var(--surface); padding: 0 28px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    font-family: 'DM Sans', sans-serif; font-size: 0.92rem; font-weight: 500;
    padding: 14px 20px; border: none; background: none; color: var(--text-muted);
    cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; margin-bottom: -1px;
  }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--text); }

  .content { padding: 24px 28px; max-width: 1100px; margin: 0 auto; }

  /* FORM */
  .form-panel { background: var(--surface); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .form-panel h2 { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 600; margin-bottom: 22px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
  input[type="date"], input[type="time"], input[type="text"] {
    font-family: 'DM Sans', sans-serif; font-size: 1rem; padding: 12px 14px;
    border: 1.5px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--text);
    appearance: none; -webkit-appearance: none; outline: none; transition: border-color 0.2s; width: 100%;
  }
  input:focus { border-color: #A8A29E; background: #fff; }

  .paciente-selector { display: flex; gap: 10px; margin-top: 2px; }
  .paciente-btn {
    flex: 1; padding: 12px; border-radius: 10px; border: 2px solid var(--border);
    background: var(--bg); font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 500;
    cursor: pointer; transition: all 0.18s; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .paciente-btn .btn-dot { width: 10px; height: 10px; border-radius: 50%; }
  .paciente-btn.papa-active { border-color: var(--papa-color); background: var(--papa-light); color: var(--papa-color); }
  .paciente-btn.mama-active { border-color: var(--mama-color); background: var(--mama-light); color: var(--mama-color); }

  .btn-guardar {
    margin-top: 20px; width: 100%; padding: 14px;
    background: var(--text); color: #fff; border: none; border-radius: 10px;
    font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 600;
    cursor: pointer; transition: opacity 0.2s, transform 0.1s;
  }
  .btn-guardar:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-guardar:not(:disabled):active { opacity: 0.85; transform: scale(0.99); }

  /* LIST */
  .citas-list { display: flex; flex-direction: column; gap: 12px; }
  .cita-card {
    background: var(--surface); border-radius: 12px; padding: 16px 18px;
    display: flex; align-items: center; gap: 16px;
    border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  }
  .cita-card .bar { width: 4px; height: 42px; border-radius: 4px; flex-shrink: 0; }
  .cita-card.papa .bar { background: var(--papa-color); }
  .cita-card.mama .bar { background: var(--mama-color); }
  .cita-info { flex: 1; }
  .cita-info .fecha-hora { font-size: 0.82rem; font-weight: 500; color: var(--text-muted); margin-bottom: 3px; }
  .cita-info .especialidad { font-size: 1rem; font-weight: 600; }
  .cita-badge { font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
  .cita-card.papa .cita-badge { background: var(--papa-light); color: var(--papa-color); }
  .cita-card.mama .cita-badge { background: var(--mama-light); color: var(--mama-color); }
  .btn-eliminar { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 8px; color: #D1D5DB; font-size: 1.1rem; transition: color 0.15s; }
  .btn-eliminar:active { color: #EF4444; }

  /* CALENDAR */
  .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .cal-month { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; }
  .nav-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 16px; font-family: 'DM Sans', sans-serif; font-size: 1rem; cursor: pointer; color: var(--text); }
  .nav-btn:active { background: var(--border); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-day-name { text-align: center; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); padding: 6px 0; }
  .cal-cell { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; min-height: 90px; padding: 8px 7px 7px; }
  .cal-cell.empty { background: transparent; border-color: transparent; }
  .cal-cell.today { border-color: #A8A29E; background: #FAFAF9; }
  .cal-num { font-size: 0.82rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; line-height: 1; }
  .cal-cell.today .cal-num {
    background: var(--text); color: #fff; width: 22px; height: 22px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; margin-bottom: 5px;
  }
  .cal-events { display: flex; flex-direction: column; gap: 3px; }
  .cal-event { border-radius: 5px; padding: 3px 5px; font-size: 0.68rem; font-weight: 600; line-height: 1.25; overflow: hidden; }
  .cal-event.papa { background: var(--papa-light); color: var(--papa-color); }
  .cal-event.mama { background: var(--mama-light); color: var(--mama-color); }
  .cal-event .ev-hora { font-weight: 400; display: block; }

  /* EMPTY */
  .empty-state { text-align: center; padding: 48px 24px; color: var(--text-muted); }
  .empty-state .icon { font-size: 2.8rem; margin-bottom: 12px; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text); color: #fff; padding: 12px 22px;
    border-radius: 100px; font-size: 0.9rem; font-weight: 500;
    opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 999; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 700px) {
    header { padding: 16px 18px 12px; }
    header h1 { font-size: 1.35rem; }
    .tabs { padding: 0 18px; }
    .content { padding: 18px 14px; }
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: 1; }
    .cal-cell { min-height: 72px; }
    .cal-event { font-size: 0.6rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>📋 Citas Médicas</h1>
    <div class="sync-indicator">
      <div class="sync-dot" id="sync-dot"></div>
      <span id="sync-label">Conectando…</span>
    </div>
  </div>
  <div class="header-legend">
    <span class="legend-dot"><span class="dot papa"></span> Papá</span>
    <span class="legend-dot"><span class="dot mama"></span> Mamá</span>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('agregar')">＋ Nueva Cita</button>
  <button class="tab-btn" onclick="showTab('calendario')">📅 Calendario</button>
  <button class="tab-btn" onclick="showTab('lista')">📋 Lista</button>
</div>

<div id="tab-agregar" class="content">
  <div class="form-panel">
    <h2>Agregar Cita</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" id="inp-fecha">
      </div>
      <div class="form-group">
        <label>Hora</label>
        <input type="time" id="inp-hora">
      </div>
      <div class="form-group full">
        <label>Especialidad</label>
        <input type="text" id="inp-especialidad" placeholder="Ej: Cardiología, Ortopedia…" autocomplete="off">
      </div>
      <div class="form-group full">
        <label>Doctor / Nota adicional (opcional)</label>
        <input type="text" id="inp-doctor" placeholder="Nombre del doctor o nota" autocomplete="off">
      </div>
      <div class="form-group full">
        <label>¿Para quién es la cita?</label>
        <div class="paciente-selector">
          <button class="paciente-btn" id="btn-papa" onclick="selPaciente('papa')">
            <span class="btn-dot" style="background:var(--papa-color)"></span> Papá
          </button>
          <button class="paciente-btn" id="btn-mama" onclick="selPaciente('mama')">
            <span class="btn-dot" style="background:var(--mama-color)"></span> Mamá
          </button>
        </div>
      </div>
    </div>
    <button class="btn-guardar" id="btn-guardar" onclick="guardarCita()">Guardar Cita</button>
  </div>
</div>

<div id="tab-calendario" class="content" style="display:none;">
  <div class="calendar-header">
    <button class="nav-btn" onclick="cambiarMes(-1)">‹</button>
    <div class="cal-month" id="cal-titulo"></div>
    <button class="nav-btn" onclick="cambiarMes(1)">›</button>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
</div>

<div id="tab-lista" class="content" style="display:none;">
  <div class="citas-list" id="citas-list"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, deleteDoc,
    doc, onSnapshot, query, orderBy
  } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDZC9YCW4jSia6zLwgGCs92BZHdysclZ4s",
    authDomain: "citas-medicas-papi-y-mami.firebaseapp.com",
    projectId: "citas-medicas-papi-y-mami",
    storageBucket: "citas-medicas-papi-y-mami.firebasestorage.app",
    messagingSenderId: "259987901878",
    appId: "1:259987901878:web:4f92e317a6920aa4a00517"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  let citas = [];
  let pacienteSeleccionado = null;
  let calMes, calAnio;
  const hoy = new Date();
  calMes  = hoy.getMonth();
  calAnio = hoy.getFullYear();
  document.getElementById('inp-fecha').value = hoy.toISOString().split('T')[0];

  // Sync indicator
  function setSyncState(state) {
    document.getElementById('sync-dot').className = 'sync-dot ' + state;
    document.getElementById('sync-label').textContent =
      ({ online: 'Sincronizado', syncing: 'Guardando…', error: 'Sin conexión' })[state] || 'Conectando…';
  }

  // Realtime listener
  const q = query(collection(db, 'citas'), orderBy('fecha'), orderBy('hora'));
  onSnapshot(q,
    snapshot => {
      citas = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      setSyncState('online');
      if (document.getElementById('tab-calendario').style.display !== 'none') renderCalendar();
      if (document.getElementById('tab-lista').style.display      !== 'none') renderLista();
    },
    () => setSyncState('error')
  );

  // Tabs
  window.showTab = tab => {
    ['agregar','calendario','lista'].forEach(t =>
      document.getElementById('tab-'+t).style.display = t === tab ? '' : 'none'
    );
    document.querySelectorAll('.tab-btn').forEach((b,i) =>
      b.classList.toggle('active', ['agregar','calendario','lista'][i] === tab)
    );
    if (tab === 'calendario') renderCalendar();
    if (tab === 'lista')      renderLista();
  };

  // Select patient
  window.selPaciente = p => {
    pacienteSeleccionado = p;
    document.getElementById('btn-papa').className = 'paciente-btn' + (p==='papa' ? ' papa-active' : '');
    document.getElementById('btn-mama').className = 'paciente-btn' + (p==='mama' ? ' mama-active' : '');
  };

  // Save appointment
  window.guardarCita = async () => {
    const fecha = document.getElementById('inp-fecha').value;
    const hora  = document.getElementById('inp-hora').value;
    const esp   = document.getElementById('inp-especialidad').value.trim();
    const docN  = document.getElementById('inp-doctor').value.trim();
    if (!fecha) { toast('Por favor ingresa la fecha'); return; }
    if (!hora)  { toast('Por favor ingresa la hora');  return; }
    if (!esp)   { toast('Por favor ingresa la especialidad'); return; }
    if (!pacienteSeleccionado) { toast('Selecciona Papá o Mamá'); return; }

    const btn = document.getElementById('btn-guardar');
    btn.disabled = true;
    setSyncState('syncing');
    try {
      await addDoc(collection(db, 'citas'), { fecha, hora, especialidad: esp, doctor: docN, paciente: pacienteSeleccionado });
      toast('✓ Cita guardada');
      document.getElementById('inp-hora').value = '';
      document.getElementById('inp-especialidad').value = '';
      document.getElementById('inp-doctor').value = '';
      pacienteSeleccionado = null;
      document.getElementById('btn-papa').className = 'paciente-btn';
      document.getElementById('btn-mama').className = 'paciente-btn';
    } catch(e) {
      toast('Error al guardar. Revisa tu conexión.');
      setSyncState('error');
    } finally {
      btn.disabled = false;
    }
  };

  // Delete
  window.eliminarCita = async id => {
    if (!confirm('¿Eliminar esta cita?')) return;
    try {
      await deleteDoc(doc(db, 'citas', id));
      toast('Cita eliminada');
    } catch { toast('Error al eliminar'); }
  };

  // Helpers
  const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const DIAS  = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const fmt12 = h => { const [hh,mm] = h.split(':').map(Number); return `${hh%12||12}:${String(mm).padStart(2,'0')} ${hh>=12?'pm':'am'}`; };
  const fmtF  = f => { const [y,m,d] = f.split('-'); return `${d}/${m}/${y}`; };

  // Calendar
  window.cambiarMes = delta => {
    calMes += delta;
    if (calMes > 11) { calMes = 0; calAnio++; }
    if (calMes < 0)  { calMes = 11; calAnio--; }
    renderCalendar();
  };

  function renderCalendar() {
    document.getElementById('cal-titulo').textContent = MESES[calMes] + ' ' + calAnio;
    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';
    DIAS.forEach(d => { const e = document.createElement('div'); e.className='cal-day-name'; e.textContent=d; grid.appendChild(e); });
    const firstDay = new Date(calAnio, calMes, 1).getDay();
    const days     = new Date(calAnio, calMes+1, 0).getDate();
    const todayStr = hoy.toISOString().split('T')[0];
    for (let i=0; i<firstDay; i++) { const e=document.createElement('div'); e.className='cal-cell empty'; grid.appendChild(e); }
    for (let d=1; d<=days; d++) {
      const ds = `${calAnio}-${String(calMes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dc = citas.filter(c=>c.fecha===ds).sort((a,b)=>a.hora.localeCompare(b.hora));
      const cell = document.createElement('div');
      cell.className = 'cal-cell' + (ds===todayStr?' today':'');
      const num = document.createElement('div'); num.className='cal-num'; num.textContent=d; cell.appendChild(num);
      const evs = document.createElement('div'); evs.className='cal-events';
      dc.forEach(c => { const ev=document.createElement('div'); ev.className='cal-event '+c.paciente; ev.innerHTML=`<span class="ev-hora">${fmt12(c.hora)}</span>${c.especialidad}`; evs.appendChild(ev); });
      cell.appendChild(evs); grid.appendChild(cell);
    }
  }

  // List
  function renderLista() {
    const el = document.getElementById('citas-list');
    if (!citas.length) {
      el.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>No hay citas registradas aún.<br>Agrega una desde "Nueva Cita".</p></div>`;
      return;
    }
    el.innerHTML = citas.map(c => `
      <div class="cita-card ${c.paciente}">
        <div class="bar"></div>
        <div class="cita-info">
          <div class="fecha-hora">${fmtF(c.fecha)} · ${fmt12(c.hora)}</div>
          <div class="especialidad">${c.especialidad}${c.doctor ? ` <span style="font-weight:400;color:var(--text-muted)">– ${c.doctor}</span>` : ''}</div>
        </div>
        <span class="cita-badge">${c.paciente==='papa'?'Papá':'Mamá'}</span>
        <button class="btn-eliminar" onclick="eliminarCita('${c.id}')">✕</button>
      </div>`).join('');
  }

  // Toast
  let tt;
  window.toast = msg => {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(tt); tt = setTimeout(()=>el.classList.remove('show'), 2200);
  };
</script>
</body>
</html>
